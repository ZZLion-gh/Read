<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生词消消乐</title>
    <style>
        body {
            background-color: #FFF8E7;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, 'PingFang SC', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 3em;
            margin: 30px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        #game-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 20px auto;
            padding: 30px;
        }

        .bubble {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: white;
            font-weight: 900;
            font-size: 1.8em;
            padding: 20px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 
                0 8px 25px rgba(0,0,0,0.15),
                inset 0 -10px 30px rgba(255,255,255,0.2);
            transform: perspective(600px) translateZ(0);
            line-height: 1.2;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            opacity: 0;
            animation: bubbleFloat 1s ease-out forwards;
        }

        @keyframes bubbleFloat {
            0% {
                transform: translateY(100px) scale(0);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .selected {
            transform: perspective(600px) translateZ(30px) scale(0.95);
            filter: brightness(1.15);
        }

        .matched {
            animation: bubblePop 0.6s ease-out forwards !important;
        }

        @keyframes bubblePop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(0); opacity: 0; }
        }

        #timer {
            position: fixed;
            right: 30px;
            top: 30px;
            font-size: 2.2em;
            color: #4ecdc4;
            background: rgba(255,255,255,0.95);
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        #success-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3em;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.3);
            padding: 40px;
            backdrop-filter: blur(10px);
            border-radius: 30px;
            z-index: 100;
        }

        .firework {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #FF6B6B;
            border-radius: 50%;
            animation: firework 1.4s ease-out forwards;
            pointer-events: none;
        }

        @keyframes firework {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            50% { transform: translateY(-200px) scale(2); }
            100% { transform: translateY(-400px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <h1>生词消消乐</h1>
    <div id="timer">00:00</div>
    <div id="game-container"></div>
    <div id="success-message">🎉 挑战成功！</div>

    <script>
        const wordPairs = {
            "champion": "冠军",
            "historic": "具有历史性意义的",
            "prominent": "重要的,著名的",
            "repetition": "重复",
            "previously": "先前地",
            "sensational": "耸人听闻的",
            "morality": "道德",
            "fascinating": "耐人寻味的",
            "profile": "简介, 概况",
            "invaded": "侵犯",
            "pop up": "突然出现",
            "evident": "明显的",
            "biased": "有偏见的",
            "viewpoint": "观点",
            "grave": "严重的",
            "generate": "产生, 创造",
            "indistinguishable": "难以分辨的",
            "fake": "赝品, 伪造",
            "sophisticated": "精密的",
            "overwhelming": "难以抗拒"
        };

        let firstBubble = null;
        let startTime = null;
        let timerInterval = null;
        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', 
                       '#FFEEAD', '#FF9F76', '#D4A5A5', '#A2836E'];

        function normalize(text) {
            return text.toLowerCase()
                      .replace(/，/g, ',')
                      .replace(/\s*,\s*/g, '|')
                      .trim();
        }

        function createGame() {
            const container = document.getElementById('game-container');
            container.innerHTML = '';
            
            // 生成配对泡泡
            const elements = [];
            Object.entries(wordPairs).forEach(([en, zh], index) => {
                const delay = index * 0.1;
                elements.push(createBubble(en, 'en', zh, delay));
                elements.push(createBubble(zh, 'zh', en, delay + 0.05));
            });

            // 高级洗牌算法
            for (let i = elements.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [elements[i], elements[j]] = [elements[j], elements[i]];
            }

            elements.forEach((bubble, index) => {
                bubble.style.animationDelay = `${index * 0.05}s`;
                container.appendChild(bubble);
            });
        }

        function createBubble(text, type, pair, delay) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            
            // 数据标准化
            bubble.dataset.normalized = normalize(text);
            bubble.dataset.pair = normalize(pair);
            bubble.dataset.type = type;
            
            // 动态颜色分配
            const colorIndex = Object.keys(wordPairs).indexOf(type === 'en' ? text : pair);
            bubble.style.backgroundColor = colors[colorIndex % colors.length];
            bubble.style.border = `3px solid ${colors[(colorIndex + 2) % colors.length]}`;
            
            bubble.addEventListener('click', handleBubbleClick);
            return bubble;
        }

        function handleBubbleClick() {
            if (this.classList.contains('matched')) return;
            
            this.classList.add('selected');
            
            if (!firstBubble) {
                firstBubble = this;
            } else {
                const isMatch = (firstBubble.dataset.pair === this.dataset.normalized) && 
                              (firstBubble.dataset.type !== this.dataset.type);
                
                if (isMatch) {
                    firstBubble.classList.replace('selected', 'matched');
                    this.classList.replace('selected', 'matched');
                    checkCompletion();
                } else {
                    setTimeout(() => {
                        firstBubble.classList.remove('selected');
                        this.classList.remove('selected');
                    }, 600);
                }
                firstBubble = null;
            }
        }

        function createFireworks() {
            for (let i = 0; i < 50; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.left = `${Math.random() * 100}%`;
                firework.style.background = `hsl(${Math.random() * 360}, 70%, 60%)`;
                firework.style.animationDelay = `${i * 0.02}s`;
                document.body.appendChild(firework);
                
                // 自动清理
                setTimeout(() => firework.remove(), 1400);
            }
        }

        function checkCompletion() {
            const remaining = document.querySelectorAll('.bubble:not(.matched)').length;
            if (remaining === 0) {
                clearInterval(timerInterval);
                document.getElementById('success-message').style.display = 'block';
                createFireworks();
            }
        }

        // 计时器功能
        function updateTimer() {
            const elapsed = Date.now() - startTime;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            document.getElementById('timer').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 初始化游戏
        document.addEventListener('DOMContentLoaded', () => {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            createGame();
            
            // Mac字体优化
            if (navigator.platform.includes('Mac')) {
                document.body.style.fontFamily = '-apple-system, PingFang SC, sans-serif';
            }
        });
    </script>
</body>
</html>
